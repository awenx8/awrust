[package]
name = "cc-core"
version = "0.5.0"
edition = "2024"
description = "A core library for configuration, PostgreSQL/MySQL and Redis connection management"
license = "MIT"
repository = "https://github.com/awenx8/awrust"
readme = "../../README.md"
keywords = ["config", "postgres", "mysql", "redis", "database"]
categories = ["database", "config"]

[features]
default = ["postgres", "redis", "tracing-init", "http", "config-db"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
redis = ["dep:redis"]
# 从 PostgreSQL 的 app_config 统一配置表读取全部配置
config-db = ["dep:sqlx", "sqlx/postgres"]
tracing-init = ["dep:tracing-subscriber"]
http = ["dep:reqwest"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }


[[example]]
name = "config_from_db"
path = "examples/config_from_db.rs"
required-features = ["config-db", "tracing-init"]

[[example]]
name = "postgres_connect"
path = "examples/postgres_connect.rs"
required-features = ["postgres", "config-db", "tracing-init"]

[[example]]
name = "mysql_connect"
path = "examples/mysql_connect.rs"
required-features = ["mysql", "config-db", "tracing-init"]

[[example]]
name = "redis_connect"
path = "examples/redis_connect.rs"
required-features = ["redis", "config-db", "tracing-init"]

[[example]]
name = "graceful_shutdown"
path = "examples/graceful_shutdown.rs"
required-features = ["postgres", "redis", "config-db", "tracing-init"]

[[example]]
name = "http_client"
path = "examples/http_client.rs"
required-features = ["http", "tracing-init"]
