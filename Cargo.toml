[workspace]
# 使用通配符自动纳入 crates/ 下的所有成员，新增子 crate 无需改动此处
members = ["crates/*"]
resolver = "2"

# 各成员 crate 共用同一套依赖版本，统一在此处声明，子 crate 用 `workspace = true` 引用。
[workspace.dependencies]
cc-core = { path = "crates/cc-core" }
# 默认使用 postgres sqlx 特征；mysql 由 cc-core 的 `mysql` feature 按需启用。
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"

[profile.release]
opt-level = 2
